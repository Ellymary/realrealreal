<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤러리</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
  .pager { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 20px 0 6px; }
  .pager .chip { min-width: 36px; text-align: center; padding: 4px 10px; cursor: pointer; }
  .pager .chip[disabled] { opacity: .4; cursor: default; }
  .count-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .count-row .chip { padding: 2px 10px; font-size: 13px; cursor: pointer; }
  .nums-off .num, .nums-off .tag-row .n, .nums-off #count { display: none; }
  .pager .gap { align-self: center; color: var(--muted); }
</style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <h1 class="page-title">갤러리</h1>
  <form class="searchbar" id="f">
    <input id="q" placeholder="태그로 검색 (예: 루티 바닐라)" autocomplete="off">
    <button>검색</button>
  </form>
  <div class="chips" id="types"></div>
  <p class="hint">만화도 여기 같이 있어요 · 여러 태그는 띄어쓰기로 · 제외는 -태그 (태그 옆 − 버튼으로도 돼요) · 앞부분 검색은 태그* · 이름에 띄어쓰기가 있으면 _ 로 (공_유안). 옆 목록을 눌러도 돼요.</p>
  <div class="active" id="active"></div>
  <div class="browser">
    <aside class="side" id="side"></aside>
    <section>
      <div class="count-row"><div class="count" id="count"></div><button type="button" class="chip" id="num-toggle"></button></div>
      <div class="grid" id="grid"></div>
      <nav class="pager" id="pager" aria-label="페이지"></nav>
    </section>
  </div>
</main>

<div class="lb" id="lb" hidden>
  <div class="lb-main" id="lb-main">
    <button class="lb-close" id="lb-close" aria-label="닫기">✕</button>
    <button class="lb-nav prev" id="lb-prev" aria-label="이전">‹</button>
    <div class="lb-img" id="lb-img"></div>
    <button class="lb-nav next" id="lb-next" aria-label="다음">›</button>
  </div>
  <aside class="lb-info" id="lb-info"></aside>
</div>
<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/guilds.js"></script>
<script src="data/characters.js"></script>
<script src="data/gallery.js"></script>
<script src="data/comics.js"></script>
<script src="data/world.js"></script>
<script src="app.js"></script>
<script src="data/music.js"></script>
<script src="player.js"></script>
<script>
  const { esc } = App;
  const $ = (id) => document.getElementById(id);
  App.nav("gallery", "갤러리");

  const all = App.galleryAll();   // 그림 + 만화
  let type = App.param("type") || "";   // "" | "image" | "comic"
  let q = (App.param("q") || "").trim();
  let shown = [];   // 지금 목록 (그림+만화)
  let imgs = [];    // 그 중 그림만 (라이트박스용)
  let cur = -1;
  const PER = 48;   // 한 페이지에 보여줄 개수 (바꾸고 싶으면 이 숫자만!)
  let page = Math.max(1, parseInt(App.param("page"), 10) || 1);

  function setQ(v) {
    q = v.trim().replace(/\s+/g, " ");
    $("q").value = q;
    page = 1;
    try {
      const u = new URL(location.href);
      u.searchParams.delete("page");
      if (q) u.searchParams.set("q", q); else u.searchParams.delete("q");
      u.searchParams.delete("img");
      history.replaceState(null, "", u);
    } catch (e) {}
    render();
  }
  function addTerm(t) {
    // 같은 태그의 반대 조건(포함 ↔ 제외)은 빼고 넣어요
    const opp = t[0] === "-" ? t.slice(1) : "-" + t;
    const terms = q.split(/\s+/).filter(Boolean).filter((x) => x !== opp);
    if (!terms.includes(t)) terms.push(t);
    setQ(terms.join(" "));
  }

  function setType(t) {
    type = t;
    page = 1;
    try { const u = new URL(location.href); u.searchParams.delete("page"); if (t) u.searchParams.set("type", t); else u.searchParams.delete("type"); history.replaceState(null, "", u); } catch (e) {}
    render();
  }

  function setPage(p, scroll) {
    page = p;
    try { const u = new URL(location.href); if (p > 1) u.searchParams.set("page", p); else u.searchParams.delete("page"); history.replaceState(null, "", u); } catch (e) {}
    render();
    if (scroll) document.querySelector(".browser").scrollIntoView({ block: "start" });
  }
  // 1 … 4 5 [6] 7 8 … 20 처럼 현재 페이지 주변만 보여줘요
  function pagerHTML(pages) {
    if (pages <= 1) return "";
    const nums = [];
    for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - page) <= 2) nums.push(i);
    const btn = (label, p, on, dis) => '<button type="button" class="chip' + (on ? " on" : "") + '"' + (dis ? " disabled" : ' data-page="' + p + '"') + ">" + label + "</button>";
    let html = btn("‹ 이전", page - 1, false, page <= 1);
    nums.forEach((n, i) => {
      if (i && n - nums[i - 1] > 1) html += '<span class="gap">…</span>';
      html += btn(n, n, n === page, false);
    });
    return html + btn("다음 ›", page + 1, false, page >= pages);
  }

  function render() {
    const byQ = all.filter((it) => App.matches(it, q));
    // 칸 나누기: 그림(시리즈 포함) / 영상 / 만화
    const cat = (it) => (App.videoOf(it) ? "video" : it.kind === "comic" && !it.series ? "comic" : "image");
    const n = { image: 0, video: 0, comic: 0 };
    byQ.forEach((it) => n[cat(it)]++);
    $("types").innerHTML = [["", "전체", byQ.length], ["image", "그림", n.image], ["video", "영상", n.video], ["comic", "만화", n.comic]]
      .map(([k, name, num]) => '<button class="chip' + (type === k ? " on" : "") + '" data-type="' + k + '">' + name + '<span class="num"> ' + num + "</span></button>").join("");
    shown = byQ.filter((it) => !type || cat(it) === type);
    imgs = shown.filter((it) => it.kind === "image");
    const terms = q.split(/\s+/).filter(Boolean);
    $("active").innerHTML = terms.map((t) => '<button class="chip' + (t.length > 1 && t[0] === "-" ? " neg" : "") + '" data-rm="' + esc(t) + '">' + esc(t) + " ✕</button>").join("");
    const sn = { image: 0, video: 0, comic: 0 };
    shown.forEach((it) => sn[cat(it)]++);
    $("count").textContent = shown.length + "개 (그림 " + sn.image + " · 영상 " + sn.video + " · 만화 " + sn.comic + ")";
    const pages = Math.max(1, Math.ceil(shown.length / PER));
    if (page > pages) page = pages;
    const imgIdx = new Map(imgs.map((it, i) => [it, i]));
    const slice = shown.slice((page - 1) * PER, page * PER);
    $("pager").innerHTML = pagerHTML(pages);
    $("grid").innerHTML = shown.length
      ? slice.map((it) => it.kind === "comic"
          ? '<a class="thumb" href="comic.html?id=' + encodeURIComponent(it.id) + '" title="' + esc(it.title || "") + '">' + App.img(it.thumb, it.title) + '<span class="badge">' + (it.series ? "시리즈 " : "만화 ") + (it.pages || []).length + "p</span></a>"
          : '<button class="thumb" data-i="' + imgIdx.get(it) + '" title="' + esc(it.title || "") + '">' + App.img(it.thumb || it.file, it.title) + (App.videoOf(it) ? '<span class="badge">▶ 영상</span>' : "") + "</button>").join("")
      : '<p class="empty">' + (all.length ? "검색 결과가 없어요." : "아직 그림/만화가 없어요. data/gallery.js, data/comics.js 에 추가해 주세요!") + "</p>";
    $("side").innerHTML = App.sidebarHTML(shown);
  }

  function openLb(i) {
    if (!imgs.length) return;
    cur = (i + imgs.length) % imgs.length;
    const it = imgs[cur];
    const chars = (it.characters || []).map((id) => App.byId[id]).filter(Boolean);
    const vd = App.videoOf(it);
    $("lb-img").innerHTML = !vd ? App.img(it.file, it.title)
      : vd.type === "drive" ? '<iframe class="lb-video" src="' + esc(vd.embed) + '" allow="autoplay; fullscreen" allowfullscreen></iframe>'
      : '<video class="lb-video" src="' + esc(vd.src) + '" controls playsinline></video>';
    $("lb-info").innerHTML =
      "<h2>" + esc(it.title || "제목 없음") + "</h2>" +
      '<p class="muted small">' + [App.artistsOf(it).length && "그림: " + App.artistsOf(it).join(", "), it.date].filter(Boolean).map((s) => esc(s)).join(" · ") + "</p>" +
      (it.desc ? "<p>" + esc(it.desc) + "</p>" : "") +
      '<h3 class="side-h">태그 (누르면 검색 · − 는 빼고 보기)</h3><div>' +
      App.tagsOf(it).map((t) => '<span class="tag-wrap"><button class="tag t-' + t.type + '" data-tag="' + esc(t.text) + '">' + esc(t.show) + '</button><button class="tag-x" data-ex="' + esc(t.text) + '" title="이 태그 빼고 보기" aria-label="' + esc(t.show) + ' 제외">−</button></span>').join("") + "</div>" +
      (chars.length ? '<h3 class="side-h">캐릭터 페이지</h3><div>' + chars.map((c) => '<a class="tag t-character" href="character.html?id=' + encodeURIComponent(c.id) + '">' + esc(c.label) + "</a>").join("") + "</div>" : "") +
      (vd ? "" : '<p><a class="link" href="' + esc(it.file) + '" target="_blank" rel="noopener">원본 열기 ↗</a></p>') +
      '<p class="muted small">' + (cur + 1) + " / " + imgs.length + "</p>";
    $("lb").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeLb() { $("lb").hidden = true; $("lb-img").innerHTML = ""; /* 영상 소리 멈추기 */ document.body.style.overflow = ""; }

  $("f").addEventListener("submit", (e) => { e.preventDefault(); setQ($("q").value); });
  $("types").addEventListener("click", (e) => { const b = e.target.closest("[data-type]"); if (b) setType(b.dataset.type); });
  $("side").addEventListener("click", (e) => {
    const x = e.target.closest("[data-ex]"); if (x) { addTerm("-" + x.dataset.ex); return; }
    const b = e.target.closest("[data-tag]"); if (b) addTerm(b.dataset.tag);
  });
  $("active").addEventListener("click", (e) => {
    const b = e.target.closest("[data-rm]");
    if (b) setQ(q.split(/\s+/).filter((t) => t !== b.dataset.rm).join(" "));
  });
  $("pager").addEventListener("click", (e) => { const b = e.target.closest("[data-page]"); if (b) setPage(+b.dataset.page, true); });
  $("grid").addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) openLb(+b.dataset.i); });
  $("lb-info").addEventListener("click", (e) => {
    const x = e.target.closest("button[data-ex]"); if (x) { closeLb(); addTerm("-" + x.dataset.ex); return; }
    const b = e.target.closest("button[data-tag]"); if (b) { closeLb(); addTerm(b.dataset.tag); }
  });
  $("lb-close").addEventListener("click", closeLb);
  $("lb-main").addEventListener("click", (e) => { if (e.target === $("lb-main") || e.target === $("lb-img")) closeLb(); });
  $("lb-prev").addEventListener("click", () => openLb(cur - 1));
  $("lb-next").addEventListener("click", () => openLb(cur + 1));
  document.addEventListener("keydown", (e) => {
    if ($("lb").hidden) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") openLb(cur - 1);
    if (e.key === "ArrowRight") openLb(cur + 1);
  });

  // 숫자 숨기기/표시: 기본은 숨김, 고른 상태는 기억해요
  let numsOn = false;
  try { numsOn = localStorage.getItem("gallery-nums") === "1"; } catch (e) {}
  function paintNums() {
    document.body.classList.toggle("nums-off", !numsOn);
    $("num-toggle").textContent = numsOn ? "숫자 숨기기" : "숫자 표시";
  }
  $("num-toggle").addEventListener("click", () => {
    numsOn = !numsOn;
    try { localStorage.setItem("gallery-nums", numsOn ? "1" : "0"); } catch (e) {}
    paintNums();
  });
  paintNums();

  $("q").value = q;
  render();
  const want = App.param("img");
  if (want) {
    const i = imgs.findIndex((it) => it.file === want);
    if (i >= 0) {
      const p = Math.floor(shown.indexOf(imgs[i]) / PER) + 1;
      if (p !== page) { page = p; render(); }
      openLb(i);
    }
  }
</script>
</body>
</html>
