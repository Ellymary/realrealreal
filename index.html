<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <div class="ticker" id="ticker" hidden><span class="tk-badge">UPDATE</span><div class="tk-view" id="tk-view"><div class="tk-track" id="tk-track"></div></div></div>
  <div class="guilds-main" id="guilds-main" style="margin-top:28px"></div>
  <div class="guilds-sub" id="guilds-sub"></div>

  <div class="quick">
    <a href="world.html"><b>세계관</b><span>설정과 용어</span></a>
    <a href="characters.html"><b>캐릭터</b><span id="n-chars"></span></a>
    <a href="gallery.html"><b>갤러리</b><span id="n-gallery"></span></a>
    <a href="playground.html"><b>놀이터</b><span>게임 · 퀴즈 · 체크리스트</span></a>
    <a href="couple.html"><b>커플</b><span>둘만의 공간</span></a>
  </div>

  <h2 class="sec-h">최근 그림·만화 <a class="link" href="gallery.html">갤러리 전체 →</a></h2>
  <div class="grid" id="recent"></div>

  <h2 class="sec-h">멤버</h2>
  <div class="members" id="members"></div>
</main>
<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/guilds.js"></script>
<script src="data/characters.js"></script>
<script src="data/extras.js"></script>
<script src="data/gallery.js"></script>
<script src="data/comics.js"></script>
<script src="data/world.js"></script>
<script src="data/updates.js"></script>
<script src="app.js"></script>
<script src="data/music.js"></script>
<script src="player.js"></script>
<script>
  const { SITE, CHARS, GALLERY, COMICS, esc } = App;
  const $ = (id) => document.getElementById(id);
  // 업데이트 줄: 같은 줄을 두 번 이어 붙여서 끊김 없이 흘러가요
  (function () {
    const list = window.UPDATES || []; if (!list.length) return;
    const one = (u) => { const inner = '<b class="tk-ver">' + esc(u.ver || "") + "</b><span>" + esc(u.text || "") + "</span>" + (u.date ? "<small>" + esc(u.date) + "</small>" : "");
      return u.href ? '<a class="tk-item" href="' + esc(u.href) + '">' + inner + "</a>" : '<span class="tk-item">' + inner + "</span>"; };
    const tr = $("tk-track"), view = $("tk-view"); $("ticker").hidden = false;
    let reps = 1; const mk = () => '<div class="tk-group">' + Array(reps).fill(list.map(one).join("")).join("") + "</div>";
    tr.innerHTML = mk() + mk();
    while (tr.firstChild.scrollWidth < view.clientWidth && reps < 8) { reps++; tr.innerHTML = mk() + mk(); }
    tr.classList.toggle("left", window.UPDATES_DIR === "left");
    tr.style.setProperty("--dur", Math.max(18, Math.round(tr.firstChild.scrollWidth / 55)) + "s");
  })();
  App.nav("home");
  $("n-chars").textContent = "캐릭터 " + App.countOf(CHARS) + "명";
  $("n-gallery").textContent = "그림 " + GALLERY.length + "장 · 만화 " + COMICS.length + "편";

  // 길드: 주요 3개는 가운데에 크게, 나머지는 작게
  const gl = App.guildList(true);
  $("guilds-main").innerHTML = gl.filter((g) => g.main).map((g) => {
    const cs = App.charsOfGuild(g);
    return `<a class="gcard" style="--gc:${g.color}" href="guild.html?id=${encodeURIComponent(g.id)}">
      <h2>${esc(g.name)}</h2>
      <div class="num">캐릭터 ${App.countOf(cs)}명</div>
      <div class="sum">${App.fmt(g.summary || "")}</div>
      <div class="names">${esc(cs.slice(0, 6).map((c) => c.label).join(" · "))}${cs.length > 6 ? " …" : ""}</div>
    </a>`;
  }).join("");
  $("guilds-sub").innerHTML = gl.filter((g) => !g.main).map((g) =>
    `<a class="gmini" style="--gc:${g.color}" href="guild.html?id=${encodeURIComponent(g.id)}"><b>${esc(g.name)}</b><span>캐릭터 ${App.countOf(App.charsOfGuild(g)) + App.extraCount(g)}명</span></a>`
  ).join("");

  $("members").innerHTML = SITE.members.map((m) => {
    const n = App.countOf(CHARS.filter((c) => c.owner === m));
    return `<a class="member" style="--mc:${App.color(m)}" href="characters.html?owner=${encodeURIComponent(m)}"><b>${esc(m)}</b><span>캐릭터 ${n}명</span></a>`;
  }).join("");

  const recent = App.galleryAll().slice(0, 8);
  $("recent").innerHTML = recent.length
    ? recent.map((it) => it.kind === "comic"
        ? `<a class="thumb" href="comic.html?id=${encodeURIComponent(it.id)}" title="${esc(it.title || "")}">${App.img(it.thumb, it.title)}<span class="badge">만화</span></a>`
        : `<a class="thumb" href="gallery.html?img=${encodeURIComponent(it.file)}" title="${esc(it.title || "")}">${App.img(it.thumb || it.file, it.title)}</a>`).join("")
    : '<p class="empty">그림 올려줘</p>';
</script>
</body>
</html>
