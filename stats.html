<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>능력치 도형</title>
<link rel="stylesheet" href="style.css">
<style>
  .sb { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px; }
  .sg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .sb input[type=text], .sb select { font: inherit; color: inherit; background: var(--panel2, var(--panel)); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .sb h2 { margin: 0 0 10px; font-size: 16px; }
  .ax { display: grid; grid-template-columns: 26px 160px minmax(50px, 1fr) 62px 28px 28px 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .ax input[type=range] { width: 100%; accent-color: var(--accent); }
  .ax input[type=text], .ax input[type=number] { width: 100%; box-sizing: border-box; padding: 6px 8px; }
  .ax .no { color: var(--muted); font-size: 12px; text-align: right; }
  .ax .ib { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; height: 28px; line-height: 28px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; color: var(--muted); }
  .ax .ib:hover:not(:disabled), .ax .ib:focus-visible { color: var(--text); border-color: var(--accent); }
  .ax .ib:disabled { opacity: .3; cursor: default; }
  #axes { max-height: 640px; overflow-y: auto; padding-right: 4px; }
  .sb textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--panel2, var(--panel)); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .sticky { position: sticky; top: 10px; }
  #chart { background: #12141c; border-radius: 10px; }
  #chart svg { width: 100%; height: auto; display: block; }
  #res img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin-top: 10px; }
  @media (max-width: 800px) { .sg { grid-template-columns: minmax(0, 1fr); } .sticky { position: static; } #axes { max-height: 480px; }
    .ax { grid-template-columns: 22px minmax(70px, 1fr) 56px 26px 26px 26px; } .ax input[type=range] { display: none; } }
</style>
<script src="theme.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <a class="back" href="playground.html">← 놀이터</a>
  <h1 class="page-title">능력치 도형</h1>
  <p class="muted">항목(각)은 원하는 만큼 추가·삭제할 수 있어요. 이름과 값은 칸에 직접 적어도 되고, 슬라이더로 조절해도 돼요. 프리셋을 누르면 항목이 한 번에 채워져요.</p>

  <div class="sb">
    <div class="row"><select id="cs" aria-label="캐릭터"></select><input type="text" id="nm" maxlength="30" placeholder="이름 (직접 적어도 돼요)" style="flex:1"></div>
    <div class="row"><b id="cnt"></b><span class="muted">최대값</span>
      <select id="mx"><option value="5">5</option><option value="10">10</option><option value="100">100</option></select>
      <span class="muted">색</span><input type="color" id="co"></div>
    <div class="row"><span class="muted">프리셋</span><span class="chips" id="ps"></span></div>
  </div>

  <div class="sg">
    <section class="sb"><h2>항목 · 값</h2><div id="axes"></div>
      <div class="row" style="margin:12px 0 0"><button type="button" class="btn btn-primary" id="b-add">＋ 항목 추가</button><button type="button" class="btn" id="b-rnd">🎲 랜덤 값</button><button type="button" class="btn" id="b-zero">값 초기화</button></div>
      <details style="margin-top:6px"><summary class="muted" style="cursor:pointer">여러 항목 한 번에 추가</summary>
        <p class="muted small" style="margin:6px 0">줄바꿈이나 쉼표로 나눠서 적으면 아래에 쭉 추가돼요.</p>
        <textarea id="bulk" rows="4" placeholder="예) 시력, 청력, 후각"></textarea>
        <div class="row" style="margin:8px 0 0"><button type="button" class="btn" id="b-bulk">추가하기</button></div></details></section>
    <section class="sb sticky"><div id="chart"></div>
      <div class="row" style="margin:12px 0 0"><button type="button" class="btn btn-primary" id="b-cap">🖼 캡쳐하기</button><span class="muted" id="msg" aria-live="polite"></span></div>
      <div id="res"></div></section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/guilds.js"></script>
<script src="data/characters.js"></script>
<script src="data/gallery.js"></script>
<script src="data/comics.js"></script>
<script src="data/world.js"></script>
<script src="data/stats.js"></script>
<script src="app.js"></script>
<script src="data/music.js"></script>
<script src="player.js"></script>
<script>
  const { esc, byId, CHARS, SITE } = App;
  const $ = (id) => document.getElementById(id);
  App.nav("playground", "능력치 도형");
  const PRE = window.STAT_PRESETS || [];
  const DEF = ["공격력", "방어력", "민첩성", "능력 희귀도", "능력 잠재력", "실용성", "체력", "지능"];
  const KEY = "hw-stats-v2", OLD = "hw-stats-v1";
  const MIN = 3, LMAX = 16, LIMIT = 120;
  const clampV = (v) => Math.max(0, Math.min(st.max, Math.round(+v || 0)));
  let st = { name: "", cid: "", max: 10, color: "#e8b923", axes: DEF.slice(0, 5).map((l) => ({ l, v: 5 })) };
  try {
    let s = JSON.parse(localStorage.getItem(KEY) || "null"), old = false;
    if (!s) { s = JSON.parse(localStorage.getItem(OLD) || "null"); old = true; }   // 예전 저장본 이어받기
    if (s && typeof s === "object") {
      st.name = String(s.name || "").slice(0, 30); st.cid = byId[s.cid] ? s.cid : "";
      st.max = [5, 10, 100].includes(+s.max) ? +s.max : 10;
      st.color = /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : st.color;
      if (Array.isArray(s.axes)) {
        let ax = s.axes;
        if (old) ax = ax.slice(0, Math.min(8, Math.max(3, +s.n || 5)));
        ax = ax.slice(0, LIMIT).map((a) => ({ l: String((a && a.l) == null ? "" : a.l).slice(0, LMAX), v: clampV(a && a.v) }));
        if (ax.length >= MIN) st.axes = ax;
      }
    }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  // 항목 수에 맞춰 크기·글씨를 자동으로 조절해요. (적을 땐 예전 모양, 많으면 글씨를 바깥쪽으로 눕혀서 겹치지 않게)
  function svg() {
    const A = st.axes, n = A.length, col = st.color;
    const many = n > 12;
    const Rr = many ? Math.min(300, 125 + (n - 12) * 5) : 125;
    const fs = many ? Math.max(8, Math.min(14, (2 * Math.PI * Rr / n) * 0.62)) : 15;
    const maxc = Math.max(1, ...A.map((a) => (a.l || "").length + String(st.max).length + 1));
    const pad = many ? Math.ceil(fs * maxc * 0.95) + 16 : 0;
    const W = many ? 2 * (Rr + pad) : 460, H = many ? W : 420;
    const cx = W / 2, cy = many ? H / 2 : 212;
    const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n;
    const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
    const f = (p) => p.map((v) => v.toFixed(1)).join(",");
    let o = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" font-family="Pretendard, \'Apple SD Gothic Neo\', \'Noto Sans KR\', \'Malgun Gothic\', sans-serif">';
    for (let k = 1; k <= 5; k++) o += '<polygon points="' + A.map((_, i) => f(pt(i, (Rr * k) / 5))).join(" ") + '" fill="none" stroke="#3a4054" stroke-width="1"/>';
    A.forEach((_, i) => { const p = pt(i, Rr); o += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#3a4054" stroke-width="1"/>'; });
    const vp = A.map((a, i) => pt(i, Rr * Math.min(1, a.v / st.max)));
    o += '<polygon points="' + vp.map(f).join(" ") + '" fill="' + col + '" fill-opacity=".35" stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round"/>';
    vp.forEach((p) => { o += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (many ? 2.5 : 4) + '" fill="' + col + '"/>'; });
    A.forEach((a, i) => {
      const c = Math.cos(ang(i)), sn = Math.sin(ang(i));
      if (!many) {
        const p = pt(i, Rr + 18);
        const anc = c > 0.3 ? "start" : c < -0.3 ? "end" : "middle", dy = sn > 0.3 ? 12 : sn < -0.3 ? -12 : 0;
        o += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy - 3).toFixed(1) + '" text-anchor="' + anc + '" fill="#e6e8f0" font-size="15" font-weight="700">' + esc(a.l) + "</text>" +
          '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy + 14).toFixed(1) + '" text-anchor="' + anc + '" fill="' + col + '" font-size="13" font-weight="700">' + a.v + "</text>";
      } else {
        // 바깥 방향으로 눕힌 글씨 (왼쪽 절반은 뒤집어서 읽기 편하게)
        const p = pt(i, Rr + 8), deg = (ang(i) * 180) / Math.PI, left = c < -0.0001;
        const rot = left ? deg + 180 : deg;
        o += '<text transform="translate(' + p[0].toFixed(1) + " " + p[1].toFixed(1) + ") rotate(" + rot.toFixed(1) + ')" text-anchor="' + (left ? "end" : "start") + '" dominant-baseline="central" font-size="' + fs.toFixed(1) + '" font-weight="700" fill="#e6e8f0">' +
          esc(a.l) + ' <tspan fill="' + col + '">' + a.v + "</tspan></text>";
      }
    });
    return { html: o + "</svg>", w: W, h: H };
  }
  const drawChart = () => { $("chart").innerHTML = svg().html; $("cnt").textContent = st.axes.length + "각형"; save(); };

  const axRow = (a, i) => {
    const n = st.axes.length;
    return '<div class="ax" data-i="' + i + '"><span class="no">' + (i + 1) + '</span>' +
      '<input type="text" class="al" maxlength="' + LMAX + '" value="' + esc(a.l) + '" placeholder="항목 이름" aria-label="항목 이름">' +
      '<input type="range" class="av" min="0" max="' + st.max + '" step="1" value="' + a.v + '" aria-label="값 슬라이더">' +
      '<input type="number" class="an" min="0" max="' + st.max + '" step="1" value="' + a.v + '" aria-label="값">' +
      '<button type="button" class="ib" data-act="up" title="위로"' + (i === 0 ? " disabled" : "") + '>↑</button>' +
      '<button type="button" class="ib" data-act="dn" title="아래로"' + (i === n - 1 ? " disabled" : "") + '>↓</button>' +
      '<button type="button" class="ib" data-act="del" title="삭제"' + (n <= MIN ? " disabled" : "") + '>✕</button></div>';
  };
  function drawAxes(keepScroll) {
    const box = $("axes"), top = box.scrollTop;
    box.innerHTML = st.axes.map(axRow).join("");
    if (keepScroll) box.scrollTop = top;
    $("b-add").disabled = st.axes.length >= LIMIT;
  }
  function drawTop() {
    $("cs").innerHTML = '<option value="">캐릭터 고르기 (선택)</option>' + CHARS.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === st.cid ? " selected" : "") + ">" + esc(c.label || c.name) + (c.owner ? " · " + esc(c.owner) : "") + "</option>").join("");
    $("nm").value = st.name; $("mx").value = String(st.max); $("co").value = st.color;
    $("ps").innerHTML = PRE.map((p, i) => '<button type="button" class="chip" data-p="' + i + '">' + esc(p.name) + " (" + (p.labels || []).length + ")</button>").join("") || '<span class="muted">data/stats.js 에 프리셋을 적어요</span>';
  }
  const all = () => { drawTop(); drawAxes(); drawChart(); };

  $("cs").addEventListener("change", (e) => { st.cid = e.target.value; if (st.cid) { const c = byId[st.cid]; st.name = c.label || c.name; $("nm").value = st.name; } drawChart(); });
  $("nm").addEventListener("input", (e) => { st.name = e.target.value; save(); });
  $("co").addEventListener("input", (e) => { st.color = e.target.value; drawChart(); });
  $("mx").addEventListener("change", (e) => { st.max = +e.target.value; st.axes.forEach((a) => { a.v = Math.min(a.v, st.max); }); drawAxes(true); drawChart(); });

  function addAxis(label, v) {
    if (st.axes.length >= LIMIT) return false;
    st.axes.push({ l: String(label).slice(0, LMAX), v: clampV(v) }); return true;
  }
  $("b-add").addEventListener("click", () => {
    addAxis("", Math.round(st.max / 2)); drawAxes(); drawChart();
    const box = $("axes"); box.scrollTop = box.scrollHeight;
    const ins = box.querySelectorAll(".al"); ins[ins.length - 1].focus();
  });
  $("b-bulk").addEventListener("click", () => {
    const ls = $("bulk").value.split(/[\n,]+/).map((x) => x.trim()).filter(Boolean);
    if (!ls.length) return;
    let added = 0; ls.forEach((l) => { if (addAxis(l, 0)) added++; });
    $("bulk").value = ""; drawAxes(); drawChart(); $("axes").scrollTop = $("axes").scrollHeight;
    $("msg").textContent = added + "개 추가했어요." + (added < ls.length ? " (최대 " + LIMIT + "개까지)" : "");
  });
  $("ps").addEventListener("click", (e) => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    const p = PRE[+b.dataset.p], ls = (p.labels || []).slice(0, LIMIT);
    if (ls.length < MIN) return;
    if (st.axes.some((a) => a.v > 0) && !confirm("'" + p.name + "' 프리셋으로 항목을 바꿀까요?\n(이름이 같은 항목의 값만 남고, 나머지는 사라져요)")) return;
    const old = {}; st.axes.forEach((a) => { if (a.l) old[a.l] = a.v; });
    st.axes = ls.map((l) => ({ l: String(l).slice(0, LMAX), v: clampV(old[l] || 0) }));
    all();
  });
  const axOf = (t) => { const r = t.closest(".ax"); return r ? st.axes[+r.dataset.i] : null; };
  $("axes").addEventListener("input", (e) => {
    const t = e.target, a = axOf(t); if (!a) return;
    const row = t.closest(".ax");
    if (t.classList.contains("al")) a.l = t.value;
    else {
      if (t.classList.contains("an") && t.value === "") return;      // 지우는 중엔 기다려요
      a.v = clampV(t.value);
      row.querySelector(".av").value = a.v;
      if (t.classList.contains("av")) row.querySelector(".an").value = a.v;
    }
    drawChart();
  });
  $("axes").addEventListener("change", (e) => {                       // 숫자 칸을 벗어날 때 값 정리
    const t = e.target, a = axOf(t);
    if (a && t.classList.contains("an")) { a.v = clampV(t.value); t.value = a.v; t.closest(".ax").querySelector(".av").value = a.v; drawChart(); }
  });
  $("axes").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const i = +b.closest(".ax").dataset.i, A = st.axes;
    if (b.dataset.act === "del") { if (A.length > MIN) A.splice(i, 1); }
    else if (b.dataset.act === "up" && i > 0) [A[i - 1], A[i]] = [A[i], A[i - 1]];
    else if (b.dataset.act === "dn" && i < A.length - 1) [A[i + 1], A[i]] = [A[i], A[i + 1]];
    drawAxes(true); drawChart();
  });
  $("b-rnd").addEventListener("click", () => { st.axes.forEach((a) => { a.v = 1 + Math.floor(Math.random() * st.max); }); drawAxes(true); drawChart(); });
  $("b-zero").addEventListener("click", () => { st.axes.forEach((a) => { a.v = 0; }); drawAxes(true); drawChart(); });

  // ── 캡쳐 (이미지로 저장) ──
  const fu = (p) => String(p == null ? "" : p).replace(/[%#?]/g, (c) => encodeURIComponent(c));
  const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
  const FONT = '"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
  $("b-cap").addEventListener("click", async () => {
    $("msg").textContent = "이미지를 만드는 중…"; $("res").innerHTML = "";
    try {
      const S = svg(), U = S.w > 900 ? 1.5 : 2, W = Math.max(460, S.w), HH = 90, H = HH + S.h + 26, R = (v) => v * U;
      const cv = document.createElement("canvas"); cv.width = Math.round(W * U); cv.height = Math.round(H * U);
      const x = cv.getContext("2d"); x.fillStyle = "#12141c"; x.fillRect(0, 0, cv.width, cv.height);
      const c = byId[st.cid], pim = c && c.image ? await load(fu(c.image)) : null;
      let tx = 24;
      if (pim) {
        x.save(); x.beginPath(); x.arc(R(54), R(45), R(30), 0, Math.PI * 2); x.clip();
        const m = Math.min(pim.width, pim.height); x.drawImage(pim, (pim.width - m) / 2, (pim.height - m) / 2, m, m, R(24), R(15), R(60), R(60)); x.restore();
        x.beginPath(); x.arc(R(54), R(45), R(30) - R(1), 0, Math.PI * 2); x.strokeStyle = st.color; x.lineWidth = R(2); x.stroke(); tx = 96;
      }
      x.textBaseline = "middle"; x.textAlign = "left"; x.fillStyle = "#fff"; x.font = "800 " + R(26) + "px " + FONT; x.fillText(st.name.trim() || "능력치", R(tx), R(38));
      x.fillStyle = "#98a2b6"; x.font = "400 " + R(13) + "px " + FONT; x.fillText(st.axes.length + "각형 · 최대 " + st.max, R(tx), R(64));
      const im = await load("data:image/svg+xml;charset=utf-8," + encodeURIComponent(S.html));
      if (!im) throw new Error("도형을 그리지 못했어요");
      x.drawImage(im, R((W - S.w) / 2), R(HH), R(S.w), R(S.h));
      x.fillStyle = "#5d667a"; x.textAlign = "right"; x.font = "400 " + R(11) + "px " + FONT; x.fillText(SITE.title || "헌터 세계관", R(W - 16), R(H - 12));
      const url = cv.toDataURL("image/png");
      const a = document.createElement("a"); a.href = url; a.download = "능력치-" + (st.name.trim().replace(/[\\/:*?"<>|]/g, "") || "도형") + ".png"; document.body.appendChild(a); a.click(); a.remove();
      $("res").innerHTML = '<img src="' + url + '" alt="저장된 능력치 이미지"><p class="muted small">자동으로 저장되지 않았다면 그림을 꾹 눌러서(또는 오른쪽 클릭) 저장해요.</p>';
      $("msg").textContent = "만들었어요!";
    } catch (err) { $("msg").textContent = "저장하지 못했어요. (" + err.message + ")"; }
  });

  all();
</script>
</body>
</html>
