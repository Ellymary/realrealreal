<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>능력치 도형</title>
<link rel="stylesheet" href="style.css">
<style>
  .sb { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px; }
  .sg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .sb input[type=text], .sb select { font: inherit; color: inherit; background: var(--panel2, var(--panel)); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .sb h2 { margin: 0 0 10px; font-size: 16px; }
  .ax { display: grid; grid-template-columns: 110px minmax(0, 1fr) 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .ax input[type=range] { width: 100%; accent-color: var(--accent); }
  .ax b { text-align: right; }
  #chart { background: #12141c; border-radius: 10px; }
  #chart svg { width: 100%; height: auto; display: block; }
  #res img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin-top: 10px; }
  @media (max-width: 800px) { .sg { grid-template-columns: minmax(0, 1fr); } .ax { grid-template-columns: 90px minmax(0, 1fr) 30px; } }
</style>
<script src="theme.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <a class="back" href="playground.html">← 놀이터</a>
  <h1 class="page-title">능력치 도형</h1>
  <p class="muted">몇 각형으로 할지 고르고, 항목 이름을 적고, 값을 정해요. 프리셋을 누르면 항목이 한 번에 채워져요.</p>

  <div class="sb">
    <div class="row"><select id="cs" aria-label="캐릭터"></select><input type="text" id="nm" maxlength="30" placeholder="이름 (직접 적어도 돼요)" style="flex:1"></div>
    <div class="row"><span class="muted">각</span><span class="chips" id="ns"></span><span class="muted">최대값</span>
      <select id="mx"><option value="5">5</option><option value="10">10</option><option value="100">100</option></select>
      <span class="muted">색</span><input type="color" id="co"></div>
    <div class="row"><span class="muted">프리셋</span><span class="chips" id="ps"></span></div>
  </div>

  <div class="sg">
    <section class="sb"><h2>항목 · 값</h2><div id="axes"></div>
      <div class="row" style="margin:12px 0 0"><button type="button" class="btn" id="b-rnd">🎲 랜덤 값</button><button type="button" class="btn" id="b-zero">값 초기화</button></div></section>
    <section class="sb"><div id="chart"></div>
      <div class="row" style="margin:12px 0 0"><button type="button" class="btn btn-primary" id="b-cap">🖼 캡쳐하기</button><span class="muted" id="msg" aria-live="polite"></span></div>
      <div id="res"></div></section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/guilds.js"></script>
<script src="data/characters.js"></script>
<script src="data/gallery.js"></script>
<script src="data/comics.js"></script>
<script src="data/world.js"></script>
<script src="data/stats.js"></script>
<script src="app.js"></script>
<script src="data/music.js"></script>
<script src="player.js"></script>
<script>
  const { esc, byId, CHARS, SITE } = App;
  const $ = (id) => document.getElementById(id);
  App.nav("playground", "능력치 도형");
  const PRE = window.STAT_PRESETS || [];
  const DEF = ["공격력", "방어력", "민첩성", "능력 희귀도", "능력 잠재력", "실용성", "체력", "지능"];
  const KEY = "hw-stats-v1";
  let st = { name: "", cid: "", n: 5, max: 10, color: "#e8b923", axes: DEF.map((l) => ({ l, v: 5 })) };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && typeof s === "object") {
      st.name = String(s.name || "").slice(0, 30); st.cid = byId[s.cid] ? s.cid : "";
      st.n = Math.min(8, Math.max(3, +s.n || 5)); st.max = [5, 10, 100].includes(+s.max) ? +s.max : 10;
      st.color = /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : st.color;
      if (Array.isArray(s.axes)) st.axes = DEF.map((l, i) => { const a = s.axes[i] || {}; return { l: String(a.l == null ? l : a.l).slice(0, 12), v: Math.max(0, Math.min(st.max, +a.v || 0)) }; });
    }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  function svg() {
    const n = st.n, A = st.axes.slice(0, n), cx = 230, cy = 212, Rr = 125, col = st.color;
    const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n;
    const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
    const f = (p) => p.map((v) => v.toFixed(1)).join(",");
    let o = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" font-family="Pretendard, \'Apple SD Gothic Neo\', \'Noto Sans KR\', \'Malgun Gothic\', sans-serif">';
    for (let k = 1; k <= 5; k++) o += '<polygon points="' + A.map((_, i) => f(pt(i, (Rr * k) / 5))).join(" ") + '" fill="none" stroke="#3a4054" stroke-width="1"/>';
    A.forEach((_, i) => { const p = pt(i, Rr); o += '<line x1="' + cx + '" y1="' + cy + '" x2="' + f([p[0]]) + '" y2="' + f([p[1]]) + '" stroke="#3a4054" stroke-width="1"/>'; });
    const vp = A.map((a, i) => pt(i, Rr * Math.min(1, a.v / st.max)));
    o += '<polygon points="' + vp.map(f).join(" ") + '" fill="' + col + '" fill-opacity=".35" stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round"/>';
    vp.forEach((p) => { o += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="' + col + '"/>'; });
    A.forEach((a, i) => {
      const p = pt(i, Rr + 18), c = Math.cos(ang(i)), sn = Math.sin(ang(i));
      const anc = c > 0.3 ? "start" : c < -0.3 ? "end" : "middle", dy = sn > 0.3 ? 12 : sn < -0.3 ? -12 : 0;
      o += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy - 3).toFixed(1) + '" text-anchor="' + anc + '" fill="#e6e8f0" font-size="15" font-weight="700">' + esc(a.l) + "</text>" +
        '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy + 14).toFixed(1) + '" text-anchor="' + anc + '" fill="' + col + '" font-size="13" font-weight="700">' + a.v + "</text>";
    });
    return o + "</svg>";
  }
  const drawChart = () => { $("chart").innerHTML = svg(); save(); };
  function drawAxes() {
    $("axes").innerHTML = st.axes.slice(0, st.n).map((a, i) => '<div class="ax"><input type="text" class="al" data-i="' + i + '" maxlength="12" value="' + esc(a.l) + '" aria-label="항목 이름"><input type="range" class="av" data-i="' + i + '" min="0" max="' + st.max + '" step="1" value="' + a.v + '"><b>' + a.v + "</b></div>").join("");
  }
  function drawTop() {
    $("cs").innerHTML = '<option value="">캐릭터 고르기 (선택)</option>' + CHARS.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === st.cid ? " selected" : "") + ">" + esc(c.label || c.name) + (c.owner ? " · " + esc(c.owner) : "") + "</option>").join("");
    $("nm").value = st.name; $("mx").value = String(st.max); $("co").value = st.color;
    $("ns").innerHTML = [3, 4, 5, 6, 7, 8].map((n) => '<button type="button" class="chip' + (st.n === n ? " on" : "") + '" data-n="' + n + '">' + n + "각</button>").join("");
    $("ps").innerHTML = PRE.map((p, i) => '<button type="button" class="chip" data-p="' + i + '">' + esc(p.name) + "</button>").join("") || '<span class="muted">data/stats.js 에 프리셋을 적어요</span>';
  }
  const all = () => { drawTop(); drawAxes(); drawChart(); };

  $("cs").addEventListener("change", (e) => { st.cid = e.target.value; if (st.cid) { const c = byId[st.cid]; st.name = c.label || c.name; $("nm").value = st.name; } drawChart(); });
  $("nm").addEventListener("input", (e) => { st.name = e.target.value; save(); });
  $("co").addEventListener("input", (e) => { st.color = e.target.value; drawChart(); });
  $("mx").addEventListener("change", (e) => { st.max = +e.target.value; st.axes.forEach((a) => { a.v = Math.min(a.v, st.max); }); drawAxes(); drawChart(); });
  $("ns").addEventListener("click", (e) => { const b = e.target.closest("[data-n]"); if (b) { st.n = +b.dataset.n; all(); } });
  $("ps").addEventListener("click", (e) => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    const p = PRE[+b.dataset.p], ls = (p.labels || []).slice(0, 8);
    if (ls.length < 3) return;
    st.n = ls.length; ls.forEach((l, i) => { st.axes[i].l = String(l).slice(0, 12); }); all();
  });
  $("axes").addEventListener("input", (e) => {
    const t = e.target, a = st.axes[+t.dataset.i]; if (!a) return;
    if (t.classList.contains("al")) a.l = t.value; else { a.v = +t.value; t.nextElementSibling.textContent = a.v; }
    drawChart();
  });
  $("b-rnd").addEventListener("click", () => { st.axes.forEach((a) => { a.v = 1 + Math.floor(Math.random() * st.max); }); drawAxes(); drawChart(); });
  $("b-zero").addEventListener("click", () => { st.axes.forEach((a) => { a.v = 0; }); drawAxes(); drawChart(); });

  // ── 캡쳐 (이미지로 저장) ──
  const fu = (p) => String(p == null ? "" : p).replace(/[%#?]/g, (c) => encodeURIComponent(c));
  const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
  const FONT = '"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
  $("b-cap").addEventListener("click", async () => {
    $("msg").textContent = "이미지를 만드는 중…"; $("res").innerHTML = "";
    try {
      const U = 2, W = 460, HH = 90, H = HH + 420 + 26, R = (v) => v * U;
      const cv = document.createElement("canvas"); cv.width = W * U; cv.height = H * U;
      const x = cv.getContext("2d"); x.fillStyle = "#12141c"; x.fillRect(0, 0, cv.width, cv.height);
      const c = byId[st.cid], pim = c && c.image ? await load(fu(c.image)) : null;
      let tx = 24;
      if (pim) {
        x.save(); x.beginPath(); x.arc(R(54), R(45), R(30), 0, Math.PI * 2); x.clip();
        const m = Math.min(pim.width, pim.height); x.drawImage(pim, (pim.width - m) / 2, (pim.height - m) / 2, m, m, R(24), R(15), R(60), R(60)); x.restore();
        x.beginPath(); x.arc(R(54), R(45), R(30) - R(1), 0, Math.PI * 2); x.strokeStyle = st.color; x.lineWidth = R(2); x.stroke(); tx = 96;
      }
      x.textBaseline = "middle"; x.textAlign = "left"; x.fillStyle = "#fff"; x.font = "800 " + R(26) + "px " + FONT; x.fillText(st.name.trim() || "능력치", R(tx), R(38));
      x.fillStyle = "#98a2b6"; x.font = "400 " + R(13) + "px " + FONT; x.fillText(st.n + "각형 · 최대 " + st.max, R(tx), R(64));
      const im = await load("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg()));
      if (!im) throw new Error("도형을 그리지 못했어요");
      x.drawImage(im, 0, R(HH), R(W), R(420));
      x.fillStyle = "#5d667a"; x.textAlign = "right"; x.font = "400 " + R(11) + "px " + FONT; x.fillText(SITE.title || "헌터 세계관", R(W - 16), R(H - 12));
      const url = cv.toDataURL("image/png");
      const a = document.createElement("a"); a.href = url; a.download = "능력치-" + (st.name.trim().replace(/[\\/:*?"<>|]/g, "") || "도형") + ".png"; document.body.appendChild(a); a.click(); a.remove();
      $("res").innerHTML = '<img src="' + url + '" alt="저장된 능력치 이미지"><p class="muted small">자동으로 저장되지 않았다면 그림을 꾹 눌러서(또는 오른쪽 클릭) 저장해요.</p>';
      $("msg").textContent = "만들었어요!";
    } catch (err) { $("msg").textContent = "저장하지 못했어요. (" + err.message + ")"; }
  });

  all();
</script>
</body>
</html>
