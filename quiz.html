<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>심리테스트</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="wrap narrow">
  <a class="back" href="playground.html">← 놀이터</a>
  <h1 class="page-title" id="title"></h1>
  <div id="quiz"></div>
</main>
<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/guilds.js"></script>
<script src="data/characters.js"></script>
<script src="data/gallery.js"></script>
<script src="data/comics.js"></script>
<script src="data/world.js"></script>
<script src="data/guildquiz.js"></script>
<script src="data/abilityquiz.js"></script>
<script src="data/abilityquiz-detail.js"></script>
<script src="app.js"></script>
<script src="data/music.js"></script>
<script src="player.js"></script>
<script>
  const { esc } = App;
  // 심리테스트 목록: 주소 quiz.html?id=guild / ability / ability-detail
  const QUIZZES = { guild: window.GUILD_QUIZ, ability: window.ABILITY_QUIZ, "ability-detail": window.ABILITY_QUIZ_DETAIL };
  const Q = QUIZZES[App.param("id")] || QUIZZES.guild;
  const $ = (id) => document.getElementById(id);
  App.nav("playground", Q.title);
  document.title = Q.title;
  $("title").textContent = Q.title;

  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const para = (s) => String(s || "").split(/\n+/).map((t) => "<p>" + esc(t) + "</p>").join("");

  // 질문 목록(list)을 차례로 풀어요. followups 가 있는 테스트는 1단계(계열) → 2단계(계열 안의 결과) 두 번에 나눠 풀어요.
  let list = Q.questions, idx = 0, score = {}, last = null, opts = [], offset = 0, stage2 = false, cat = null;
  const totalQ = () => Q.questions.length + (Q.followups ? 3 : 0);

  function start() {
    list = Q.questions; idx = 0; score = {}; last = null; offset = 0; stage2 = false; cat = null;
    $("quiz").innerHTML =
      '<div class="quiz-box"><p>' + esc(Q.intro) + '</p><button class="btn btn-primary" id="go" type="button">시작하기</button></div>';
    $("go").addEventListener("click", ask);
  }

  function ask() {
    const q = list[idx];
    opts = shuffle(q.a);   // 보기 순서는 매번 랜덤
    $("quiz").innerHTML =
      '<div class="quiz-bar"><span style="width:' + ((offset + idx) / totalQ() * 100) + '%"></span></div>' +
      '<p class="muted small">' + (offset + idx + 1) + " / " + totalQ() + (stage2 ? " · 마지막 단계!" : "") + "</p>" +
      '<h2 class="quiz-q">' + esc(q.q) + "</h2>" +
      '<div class="quiz-opts">' + opts.map((o, i) => '<button class="quiz-opt" type="button" data-i="' + i + '">' + esc(o.t) + "</button>").join("") + "</div>";
  }

  // 가장 점수가 높은 결과. 동점이면 마지막 질문에서 고른 답, 그래도 여러 개면 랜덤
  function winner(ids) {
    const top = Math.max(...ids.map((id) => score[id] || 0));
    const tied = ids.filter((id) => (score[id] || 0) === top);
    return tied.length === 1 ? tied[0] : tied.includes(last) ? last : tied[Math.floor(Math.random() * tied.length)];
  }

  function pick(i) {
    const g = opts[i].g;
    score[g] = (score[g] || 0) + 1;
    last = g;
    idx++;
    if (idx < list.length) return ask();
    if (Q.followups && !stage2) {            // 1단계 끝 → 계열을 정하고 그 계열의 추가 질문으로
      cat = winner(Object.keys(Q.categories));
      list = Q.followups[cat]; offset = Q.questions.length; idx = 0; score = {}; last = null; stage2 = true;
      return ask();
    }
    finish();
  }

  function finish() {
    const ids = stage2 ? [...new Set(list.flatMap((q) => q.a.map((o) => o.g)))] : Object.keys(Q.results);
    const win = winner(ids);
    const r = Q.results[win];
    const isGuild = Q.type === "guild";
    const g = isGuild ? (App.guildById(win) || { name: win, color: "#98a2b6" }) : null;
    const name = isGuild ? g.name : r.name, color = isGuild ? g.color : r.color;
    const chars = isGuild ? App.charsOfGuild(g)
      : App.CHARS.filter((c) => { const a = String((c.info || {})["능력"] || ""); return a && a !== "X" && (r.match || []).some((k) => a.includes(k)); });
    const label = (id) => (Q.results[id].name || (App.guildById(id) || { name: id }).name);
    $("quiz").innerHTML =
      '<div class="quiz-result" style="--mc:' + esc(color) + '">' +
        '<p class="muted small">' + esc(Q.resultLabel) + "</p>" +
        '<h2 class="quiz-gname">' + esc(name) + "</h2>" +
        '<div class="quiz-sc">' + ids.map((id) => esc(label(id)) + " " + (score[id] || 0)).join(" · ") + "</div>" +
        "<h3 class='side-h'>당신은</h3>" + para(r.you) +
        "<h3 class='side-h'>" + esc(Q.aboutLabel) + "</h3>" + para(r.about) +
        (chars.length ? '<h3 class="side-h">' + esc(isGuild ? name + " " + Q.charLabel : Q.charLabel) + '</h3><div class="cards">' + chars.map(App.charCard).join("") + "</div>" : "") +
        '<p style="margin-top:20px">' + (isGuild ? '<a class="btn" href="guild.html?id=' + encodeURIComponent(g.id || win) + '">' + esc(name) + ' 길드 보러 가기</a> ' : "") +
        '<button class="btn" id="again" type="button">다시 하기</button> <a class="btn" href="playground.html">놀이터로</a></p>' +
      "</div>";
    $("again").addEventListener("click", start);
    window.scrollTo(0, 0);
  }

  $("quiz").addEventListener("click", (e) => { const b = e.target.closest(".quiz-opt"); if (b) pick(+b.dataset.i); });
  start();
</script>
</body>
</html>
