<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>커플</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <h1 class="page-title">커플</h1>

  <div id="list"></div>

  <h2 class="sec-h">커스텀 <small>원하는 두 캐릭터를 골라 보기</small></h2>
  <div class="cp-pick">
    <select id="pa" aria-label="첫 번째 캐릭터"></select>
    <span class="cp-x">×</span>
    <select id="pb" aria-label="두 번째 캐릭터"></select>
  </div>
  <div id="custom"></div>

  <h2 class="sec-h">궁합 테스트 <small>재미로 보는 완전 랜덤 궁합</small></h2>
  <div class="cp-pick">
    <select id="ca" aria-label="첫 번째 캐릭터"></select>
    <span class="cp-x">♥</span>
    <select id="cb" aria-label="두 번째 캐릭터"></select>
    <button type="button" class="btn btn-primary" id="c-go">궁합 보기</button>
  </div>
  <p class="muted small cp-hint">누를 때마다 결과가 바뀌어요. 진지하게 믿지 말기!</p>
  <div id="compat"></div>

  <h2 class="sec-h">2차 커플링</h2>
  <div id="list2"></div>

</main>
<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/guilds.js"></script>
<script src="data/characters.js"></script>
<script src="data/gallery.js"></script>
<script src="data/comics.js"></script>
<script src="data/world.js"></script>
<script src="data/couples.js"></script>
<script src="data/compat.js"></script>
<script src="app.js"></script>
<script src="data/music.js"></script>
<script src="player.js"></script>
<script>
  const { esc, byId, fmt } = App;
  App.nav("couple", "커플");

  // 표에 먼저 나오는 칸 (이 밖의 칸 이름을 써도 아래에 따로 나와요)
  const FIELDS = ["관계", "호칭", "만난 계기", "시작", "분위기", "데이트", "키워드", "노래"];

  // member: "캐릭터id"  또는  { name: "트랜스", ids: ["id1", "id2"] } (한 캐릭터의 여러 모습)
  function norm(m) {
    const ids = typeof m === "string" ? [m] : (m && m.ids) || [];
    const chars = ids.map((id) => byId[id]).filter(Boolean);
    if (!chars.length || chars.length !== ids.length) return null;
    const first = chars[0];
    return { chars, first, group: chars.length > 1, name: (m && m.name) || first.name };
  }

  function member(m) {
    const gd = App.guildOf(m.first);
    const href = "character.html?id=" + encodeURIComponent(m.first.id);
    const fb = m.group && !m.first.image ? '<div class="avatar-fb" style="--mc:' + gd.color + '">' + esc([...m.name][0]) + "</div>" : App.avatar(m.first);
    return '<div class="cp-who" style="--mc:' + gd.color + '">' +
      '<a class="cp-link" href="' + href + '"><span class="cp-pic">' + fb + "</span>" +
      '<span class="cp-nm">' + esc(m.name) + "</span></a>" +
      '<span class="cp-sub">' + esc([m.first.owner, gd.name].filter(Boolean).join(" · ")) + "</span>" +
      (m.group ? '<span class="cp-forms">' + m.chars.map((c) => '<a class="tag" href="character.html?id=' + encodeURIComponent(c.id) + '">' + esc(c.name) + "</a>").join("") + "</span>" : "") +
      "</div>";
  }

  function couple(cp, custom) {
    const ms = (cp.members || []).map(norm);
    if (ms.length < 2 || ms.length > 3 || ms.includes(null)) return '<p class="empty">커플에 쓴 캐릭터 id 를 찾을 수 없어요. data/couples.js 를 확인해 주세요.</p>';
    const [a, b] = ms;
    const three = ms.length === 3;
    const info = cp.info || {};
    const keys = FIELDS.concat(Object.keys(info).filter((k) => !FIELDS.includes(k)));
    const rows = keys.filter((k) => info[k]).map((k) => "<tr><th>" + esc(k) + "</th><td>" + fmt(info[k]) + "</td></tr>").join("");
    const has = (g, m) => (g.characters || []).some((id) => m.chars.some((c) => c.id === id));
    const pics = App.GALLERY.filter((g) => (three ? ms.filter((m) => has(g, m)).length >= 2 : has(g, a) && has(g, b))).sort(App.byDateDesc);
    // 갤러리 검색은 AND 라서, 여러 모습인 쪽은 빼고 한 명짜리 태그로 찾아요
    const single = three ? [ms[1]] : ms.filter((m) => !m.group);
    const q = encodeURIComponent((single.length ? single : [a]).map((m) => App.tagText(m.first.label)).join(" "));
    const empty = !custom && !cp.summary && !rows && !cp.desc;
    return '<section class="couple">' +
      '<div class="cp-head">' + ms.map(member).join('<span class="cp-x" aria-label="커플">×</span>') + "</div>" +
      '<div class="cp-body">' +
        (cp.summary ? '<p class="lead">' + fmt(cp.summary) + "</p>" : "") +
        (rows ? '<table class="info sheet">' + rows + "</table>" : "") +
        (cp.desc ? '<div class="desc">' + App.text(cp.desc) + "</div>" : "") +
        (empty ? '<p class="muted">아직 소개가 없어요. data/couples.js 에서 채워 주세요.</p>' : "") +
        '<h3 class="cp-pics-h">같이 있는 그림 <small>' + pics.length + "</small>" + (pics.length ? '<a class="link" href="gallery.html?q=' + q + '">갤러리에서 보기 →</a>' : "") + "</h3>" +
        (pics.length
          ? '<div class="grid">' + pics.map((it) => '<a class="thumb" title="' + esc(it.title || "") + '" href="gallery.html?q=' + q + "&img=" + encodeURIComponent(it.file) + '">' + App.img(it.thumb || it.file, it.title) + "</a>").join("") + "</div>"
          : '<p class="muted small">아직 두 사람이 같이 태그된 그림이 없어요.</p>') +
      "</div></section>";
  }

  const list = window.COUPLES || [];
  document.getElementById("list").innerHTML = list.length ? list.map((cp) => couple(cp)).join("") : '<p class="empty">아직 등록된 커플이 없어요. data/couples.js 에서 추가해 주세요.</p>';
  const list2 = window.COUPLES2 || [];
  document.getElementById("list2").innerHTML = list2.length ? list2.map((cp) => couple(cp)).join("") : '<p class="empty">아직 없어요. data/couples.js 의 COUPLES2 에 추가해 주세요.</p>';

  // 커스텀: 두 캐릭터를 고르면 둘이 같이 나온 그림이 나와요
  const $ = (id) => document.getElementById(id);
  const opts = '<option value="">캐릭터 고르기</option>' + App.CHARS.map((c) => '<option value="' + esc(c.id) + '">' + esc(c.label || c.name) + "</option>").join("");
  $("pa").innerHTML = opts; $("pb").innerHTML = opts;
  const KEY = "hw-couple-custom";
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) { if (byId[s[0]]) $("pa").value = s[0]; if (byId[s[1]]) $("pb").value = s[1]; } } catch (e) {}
  function drawCustom() {
    const a = $("pa").value, b = $("pb").value;
    try { localStorage.setItem(KEY, JSON.stringify([a, b])); } catch (e) {}
    $("custom").innerHTML = !a || !b ? '<p class="muted">두 캐릭터를 모두 고르면 둘이 같이 있는 그림이 나와요.</p>'
      : a === b ? '<p class="empty">서로 다른 두 캐릭터를 골라 주세요.</p>' : couple({ members: [a, b] }, true);
  }
  $("pa").addEventListener("change", drawCustom); $("pb").addEventListener("change", drawCustom);
  drawCustom();

  // 궁합 테스트: 두 캐릭터를 고르고 버튼을 누르면 랜덤 퍼센트 + 문구가 나와요 (문구는 data/compat.js)
  $("ca").innerHTML = opts; $("cb").innerHTML = opts;
  const CKEY = "hw-compat-pick";
  try { const s = JSON.parse(localStorage.getItem(CKEY) || "null"); if (s) { if (byId[s[0]]) $("ca").value = s[0]; if (byId[s[1]]) $("cb").value = s[1]; } } catch (e) {}
  function drawCompat() {
    const a = $("ca").value, b = $("cb").value;
    try { localStorage.setItem(CKEY, JSON.stringify([a, b])); } catch (e) {}
    if (!a || !b) { $("compat").innerHTML = '<p class="muted">두 캐릭터를 모두 고르고 "궁합 보기"를 눌러요.</p>'; return; }
    if (a === b) { $("compat").innerHTML = '<p class="empty">서로 다른 두 캐릭터를 골라 주세요.</p>'; return; }
    const pct = Math.floor(Math.random() * 101);
    const tiers = (window.COMPAT || []).slice().sort((x, y) => y.min - x.min);
    const t = tiers.find((x) => pct >= x.min) || { tier: "", msgs: [""] };
    const msg = t.msgs[Math.floor(Math.random() * t.msgs.length)];
    $("compat").innerHTML = '<div class="compat-box"><div class="compat-who">' + member(norm(a)) + '<span class="cp-x">♥</span>' + member(norm(b)) + "</div>" +
      '<div class="compat-pct"><span id="c-num">0</span><small>%</small></div>' +
      '<div class="compat-bar"><span id="c-bar"></span></div>' +
      '<p class="compat-msg">' + esc(msg) + "</p>" + (t.tier ? '<p class="compat-tier">' + esc(t.tier) + "</p>" : "") +
      '<div class="compat-ctrl"><button type="button" class="btn" id="c-again">다시 보기</button></div></div>';
    $("c-again").addEventListener("click", drawCompat);
    // 숫자가 올라가는 연출
    requestAnimationFrame(() => { $("c-bar").style.width = pct + "%"; });
    const t0 = performance.now();
    (function tick(now) { const k = Math.min(1, (now - t0) / 900); $("c-num").textContent = Math.round(pct * k); if (k < 1) requestAnimationFrame(tick); })(t0);
  }
  $("c-go").addEventListener("click", drawCompat);
</script>
</body>
</html>
